# Desktop browser workspace. Crate version 23.3.2. Not published.
#
# Page pipeline, in the sibling repository anvil-engine, in order:
#   anvil-dom parses HTML into one node list.
#   anvil-style computes the cascade for those nodes.
#   anvil-layout places boxes and measures text with anvil-ttf.
#   anvil-paint records a display list and applies zoom.
#   anvil-raster fills a CPU framebuffer from that list (with optional C++20 scanline/SDF/compositor helpers and anvil-gpu passes).
#
# Beside that pipeline:
#   anvil-script runs a budgeted JS runtime, WebAssembly 1.0 stack VM, and optional C++20 AnvilVM register bytecode interpreter against the document and uses anvil-json.
#   anvil-net loads HTTP and HTTPS documents over HTTP/1.1 or HTTP/2 and uses anvil-cipher, anvil-compress, anvil-hpack, anvil-json, and anvil-pqc.
#   anvil-sandbox applies process limits. Each tab has one --renderer process for
#   http(s) pages and local files. anvil:// pages are built in the window process.
#   anvil-browser owns the window, tabs, downloads, and the sealed profile file (with persisted localStorage).
#
# anvil-engine and the eleven companion libraries are separate repositories next to
# this directory, linked by path, not crates.io crates. A browser change that
# needs an engine or library change is tested and pushed to that repository
# before this repository ships.
#
# LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial (PolyForm Noncommercial 1.0.0 OR Paid Commercial with Non-Compete):
# applies across anvil-browser, anvil-engine, and all eleven companion repositories.

[workspace]
resolver = "3"
members = [
    "crates/anvil-net",
    "crates/anvil-sandbox",
    "crates/anvil-browser",
]

[workspace.package]
version = "23.3.2"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
description = "Small desktop browser (Proof of Concept). HTML, CSS, layout, raster, and a budgeted script runtime, with optional C++20 helpers."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
repository = "https://github.com/buntatoes/anvil-browser"
publish = false

[workspace.dependencies]
anvil-dom = { path = "../anvil-engine/crates/anvil-dom" }
anvil-style = { path = "../anvil-engine/crates/anvil-style" }
anvil-layout = { path = "../anvil-engine/crates/anvil-layout" }
anvil-paint = { path = "../anvil-engine/crates/anvil-paint" }
anvil-raster = { path = "../anvil-engine/crates/anvil-raster" }
anvil-script = { path = "../anvil-engine/crates/anvil-script" }
anvil-compress = { path = "../anvil-compress" }
anvil-cipher = { path = "../anvil-cipher" }
anvil-css = { path = "../anvil-css" }
anvil-image = { path = "../anvil-image" }
anvil-js = { path = "../anvil-js" }
anvil-hpack = { path = "../anvil-hpack" }
anvil-json = { path = "../anvil-json" }
anvil-pqc = { path = "../anvil-pqc" }
anvil-ttf = { path = "../anvil-ttf" }
anvil-gpu = { path = "../anvil-gpu" }
anvil-video = { path = "../anvil-video" }
