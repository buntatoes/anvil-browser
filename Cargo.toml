[workspace]
resolver = "3"
members = [
    "crates/flux-dom",
    "crates/flux-style",
    "crates/flux-layout",
    "crates/flux-paint",
    "crates/flux-raster",
    "crates/flux-script",
    "crates/flux-net",
    "crates/flux-sandbox",
    "crates/flux-browser",
]

[workspace.package]
version = "0.16.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
description = "Flux Browser 0.16 — a small from-scratch desktop browser written in Rust, with a bit of C++ for raster math."
license = "Apache-2.0 AND LicenseRef-Proprietary"
repository = "https://github.com/buntatoes/flux-browser"
publish = false

[workspace.dependencies]
flux-compress = { path = "../flux-compress" }
flux-cipher = { path = "../flux-cipher" }
flux-image = { path = "../flux-image" }
flux-json = { path = "../flux-json" }
flux-ttf = { path = "../flux-ttf" }
flux-gpu = { path = "../flux-gpu" }
flux-video = { path = "../flux-video" }
