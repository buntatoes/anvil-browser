# Desktop browser workspace. Crate version 0.24.4. Not published.
#
# Page pipeline, in the sibling repository anvil-engine, in order:
#   anvil-dom parses HTML into one node list.
#   anvil-style computes the cascade for those nodes and links the Prism engine (`engines/prism`) directly.
#   anvil-layout places boxes and measures text with anvil-ttf.
#   anvil-paint records a display list and applies zoom.
#   anvil-raster fills a CPU framebuffer from that list (with optional C++20 scanline/SDF/compositor helpers and anvil-gpu passes).
#
# In-tree engines (`engines/` and `ui/`, not Cargo crates, linked directly into the core):
#   engines/prism: CSS Syntax Level 3 tokenizer, Selectors Level 4, Color 4/5, Values 4 math, and C++20 CSS engine kernels (`prism_css_engine`).
#   engines/cinder: Register-bytecode JS VM, generational arena GC, ES2022-ES2024 stdlib, 26-module self-hosted Core JS compiler/DOM runtime, and C++20 CinderVM (`cinder_engine`).
#   ui/: Native C++20 Direct2D + DirectWrite + DWM desktop UI shell and chrome layer (`anvil_ui_shell`), plus `frontend/` TypeScript/TSX built-in pages.
#
# In-tree crates in this workspace:
#   anvil-net loads HTTP and HTTPS documents over HTTP/1.1 or HTTP/2 and uses anvil-cipher, anvil-compress, anvil-hpack, anvil-json, anvil-pqc, and adblock (adblock-rust, MPL-2.0).
#   anvil-sandbox applies process limits. Each tab has one --renderer process for
#   http(s) pages and local files. anvil:// pages are built in the window process.
#   anvil-browser owns the Rust browser core (`Session`, `core_abi`), downloads, and the sealed profile file (with persisted localStorage).
#
# LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial (PolyForm Noncommercial 1.0.0 OR Paid Commercial with Non-Compete):
# applies across anvil-browser, anvil-engine, and all companion repositories.
# The linked unmodified adblock-rust crate (`../adblock-rust`) is licensed under MPL-2.0.

[workspace]
resolver = "3"
members = [
    "crates/anvil-net",
    "crates/anvil-sandbox",
    "crates/anvil-browser",
]

[workspace.package]
version = "0.24.4"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
description = "Small desktop browser (Proof of Concept). HTML, CSS, layout, raster, and a budgeted script runtime, with C++20 UI and engine layers."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
repository = "https://github.com/buntatoes/anvil-browser"
publish = false

[workspace.dependencies]
anvil-dom = { path = "../anvil-engine/crates/anvil-dom" }
anvil-style = { path = "../anvil-engine/crates/anvil-style" }
anvil-layout = { path = "../anvil-engine/crates/anvil-layout" }
anvil-paint = { path = "../anvil-engine/crates/anvil-paint" }
anvil-raster = { path = "../anvil-engine/crates/anvil-raster" }
anvil-script = { path = "../anvil-engine/crates/anvil-script" }
anvil-compress = { path = "../anvil-compress" }
anvil-cipher = { path = "../anvil-cipher" }
anvil-image = { path = "../anvil-image" }
anvil-hpack = { path = "../anvil-hpack" }
anvil-json = { path = "../anvil-json" }
anvil-pqc = { path = "../anvil-pqc" }
anvil-ttf = { path = "../anvil-ttf" }
anvil-gpu = { path = "../anvil-gpu" }
anvil-video = { path = "../anvil-video" }
adblock = { path = "../adblock-rust", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
