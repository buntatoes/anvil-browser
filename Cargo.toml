# SPDX-License-Identifier: Apache-2.0
# Desktop browser workspace. Release v.25 (0.25.0). Not published.
#
# Page pipeline (wired to the pure-Go Forge engine in engines/go/anvil-forge and in-process crates):
#   anvil-dom parses HTML into one node list.
#   anvil-style computes the cascade for those nodes and links the Prism engine (`engines/prism`) directly.
#   anvil-layout places boxes and measures text with anvil-ttf.
#   anvil-paint records a display list and applies zoom.
#   anvil-raster fills a CPU framebuffer from that list (with optional C++20 scanline/SDF/compositor helpers and anvil-gpu passes).
#
# In-tree engines (`engines/` and `ui/`, not Cargo crates, linked directly into the core):
#   engines/prism: CSS Syntax Level 3 tokenizer, Selectors Level 4, Color 4/5, Values 4 math, and C++20 CSS engine kernels (`prism_css_engine`).
#   engines/cinder: Register-bytecode JS VM, generational arena GC, ES2022-ES2024 stdlib, 26-module self-hosted Core JS compiler/DOM runtime, and C++20 CinderVM (`cinder_engine`).
#   engines/go: Go (`go1.27.3`) engine subsystem (`VerifyGoSubsystems`, `PackBundle`/`UnpackBundle` `AVGB`, `AnalyzeNetworkTrace`/`ExportHAR12`).
#   ui/: Native C++20 Direct2D + DirectWrite + DWM desktop UI shell and chrome layer (`anvil_ui_shell`), plus `frontend/` TypeScript/TSX built-in pages.
#
# In-tree crates in this workspace:
#   anvil-net loads HTTP and HTTPS documents over HTTP/1.1 or HTTP/2 and uses anvil-cipher, Go anvil-compress, Go anvil-hpack, Go anvil-json, Go anvil-pqc, and adblock (adblock-rust, MPL-2.0).
#   anvil-sandbox applies process limits. Each tab has one --renderer process for
#   http(s) pages and local files. anvil:// pages are built in the window process.
#   anvil-browser owns the Rust browser core (`Session`, `core_abi`), downloads, and the sealed profile file (with persisted localStorage).
#
# Apache-2.0 (Apache License, Version 2.0, with Section 6 Trademark & Brand Logo Reservation):
# applies across the entire anvil-browser repository (`crates/`, `engines/`, `ui/`, `frontend/`).
# The linked unmodified adblock-rust crate (`../adblock-rust`) is licensed under MPL-2.0.

[workspace]
resolver = "3"
members = [
    "crates/anvil-dom",
    "crates/anvil-style",
    "crates/anvil-layout",
    "crates/anvil-paint",
    "crates/anvil-raster",
    "crates/anvil-script",
    "crates/anvil-gpu",
    "crates/anvil-video",
    "crates/anvil-net",
    "crates/anvil-sandbox",
    "crates/anvil-browser",
    "crates/anvil-cipher",
    "crates/anvil-ttf",
    "crates/anvil-image",
]

[workspace.package]
version = "0.25.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato"]
description = "Small desktop browser (Proof of Concept). HTML, CSS, layout, raster, and a budgeted script runtime, with Go, Rust, and C++20 UI and engine layers."
license = "Apache-2.0"
repository = "https://github.com/buntatoes/anvil-browser"
publish = false

[workspace.dependencies]
anvil-dom = { path = "crates/anvil-dom" }
anvil-style = { path = "crates/anvil-style" }
anvil-layout = { path = "crates/anvil-layout" }
anvil-paint = { path = "crates/anvil-paint" }
anvil-raster = { path = "crates/anvil-raster" }
anvil-script = { path = "crates/anvil-script" }
anvil-gpu = { path = "crates/anvil-gpu" }
anvil-video = { path = "crates/anvil-video" }
anvil-cipher = { path = "crates/anvil-cipher" }
anvil-image = { path = "crates/anvil-image" }
anvil-ttf = { path = "crates/anvil-ttf" }
adblock = { path = "../adblock-rust", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
