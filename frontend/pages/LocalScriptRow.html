<!-- One file on anvil://settings/scripts. frontend.rs fills it in. -->
<div class="setting-row">
  <div class="setting-info">
    <p class="setting-label">{{file}}</p>
    <p class="sec-desc">{{status}} | Runs on: {{matches}}</p>
  </div>
  <div class="setting-actions-inline">
    <a class="setting-action-pill" href="{{toggleLink}}">{{toggleAction}}</a>
  </div>
</div>
