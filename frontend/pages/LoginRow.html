<!-- One login on anvil://settings/logins. frontend.rs fills it in. -->
<div class="setting-row">
  <div class="setting-info">
    <p class="setting-label">{{host}}</p>
    <p class="sec-desc">Username: {{username}} | Password: {{password}}</p>
  </div>
  <div class="setting-actions-inline">
    <a class="setting-action-pill" href="{{revealLink}}">{{revealAction}}</a>
    <a class="setting-action-pill" href="{{removeLink}}">Remove</a>
  </div>
</div>
