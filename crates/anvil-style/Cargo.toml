# SPDX-License-Identifier: Apache-2.0
# CSS parser and cascade. Reads anvil-dom nodes and links the Prism engine directly.
# Does not place boxes. anvil-layout reads the computed style. anvil-raster also reads style values
# that the display list did not fully flatten.

[package]
name = "anvil-style"
description = "CSS cascade and media queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
anvil-dom = { path = "../anvil-dom" }
