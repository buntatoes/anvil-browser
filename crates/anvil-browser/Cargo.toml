# Application crate. Two binaries: `anvil` (window, headless raster, --renderer)
# and `anvil-setup` (packaged setup). Calls every engine crate plus the siblings
# listed below.
# anvil-cipher is a direct dependency on non-Windows targets only. Linux
# profile.anvil is AES-256-GCM. Windows profile.anvil is DPAPI. anvil-video
# still links anvil-cipher on every target, Windows included.
# anvil-compress wraps the profile snapshot and the setup payload.
# anvil-gpu, anvil-image, anvil-json, anvil-ttf, and anvil-video are used by the
# session directly as well as by the engine crates.

[package]
name = "anvil-browser"
description = "Window, pages, downloads, and the profile file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "anvil"
path = "src/main.rs"

[[bin]]
name = "anvil-setup"
path = "src/bin/anvil-setup.rs"

[dependencies]
anvil-dom.workspace = true
anvil-layout.workspace = true
anvil-net = { path = "../anvil-net" }
anvil-paint.workspace = true
anvil-raster.workspace = true
anvil-sandbox = { path = "../anvil-sandbox" }
anvil-script.workspace = true
anvil-style.workspace = true
anvil-compress.workspace = true
anvil-gpu.workspace = true
anvil-image.workspace = true
anvil-json.workspace = true
anvil-ttf.workspace = true
anvil-video.workspace = true

[target.'cfg(not(windows))'.dependencies]
anvil-cipher.workspace = true
