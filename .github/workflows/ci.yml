# Build, test, lint, and release-build anvil-browser on Linux and Windows.
#
# The engines and libraries all live in this repository now. The one path
# dependency outside it is adblock-rust, so the job checks this repository out
# into its own folder and fetches adblock-rust next to it at a pinned commit.
#
# adblock-rust is the one outside crate, and it brings its own crates.io
# dependencies. Every cargo command runs with --locked, so cargo only fetches
# exactly what Cargo.lock lists, and the check step below fails if any anvil
# crate itself depends on a crate from outside the anvil repositories.

name: ci

on:
  push:
    branches: [daily, weekly, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "33554432"
  # adblock-rust is pinned to the commit Cargo.lock was made from (0.13.3).
  ADBLOCK_RUST_REV: 6028a6d5735f1e81346eeef73c194c7240035248

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: anvil-browser
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-browser

      - name: Check out adblock-rust
        working-directory: .
        run: |
          git init -q adblock-rust
          git -C adblock-rust fetch -q --depth 1 https://github.com/brave/adblock-rust.git "$ADBLOCK_RUST_REV"
          git -C adblock-rust checkout -q FETCH_HEAD

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libssl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          cache: false

      - name: Test in-tree Go engines
        working-directory: anvil-browser/engines/go
        run: |
          go vet ./...
          go test -v ./...
          for mod in anvil-compress anvil-hpack anvil-json anvil-pqc anvil-ttf anvil-image anvil-gpu anvil-video anvil-forge; do
            (cd "$mod" && go vet ./... && go test ./...)
          done

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Check for outside crates
        run: |
          # Fails if Cargo.lock is out of date. Registry and git crates have a
          # source line in Cargo.lock; path crates don't. Only adblock-rust and
          # the crates it pulls in may have one, so no anvil crate may depend
          # on a crate that has a source line.
          cargo metadata --locked --format-version 1 > /dev/null
          awk '
            /^\[\[package\]\]/ { name = ""; outside = 0; n = 0; next }
            /^name = / { name = $3; gsub(/"/, "", name); next }
            /^source = / { outside = 1; next }
            /^ "/ { dep = $1; gsub(/[",]/, "", dep); deps[name, ++n] = dep; count[name] = n; next }
            /^$/ { if (name != "") { from_outside[name] = outside }; next }
            END {
              if (name != "") { from_outside[name] = outside }
              bad = 0
              for (pkg in from_outside) {
                if (pkg !~ /^anvil-/ || from_outside[pkg]) continue
                for (i = 1; i <= count[pkg]; i++) {
                  if (from_outside[deps[pkg, i]]) {
                    print pkg " depends on " deps[pkg, i] ", which is not an anvil crate."
                    bad = 1
                  }
                }
              }
              exit bad
            }
          ' Cargo.lock

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release build
        run: |
          set -euo pipefail
          # Rust records source paths in the binary. Point those at fixed
          # prefixes so a daily build does not keep the machine's home directory.
          flags=()
          src="${GITHUB_WORKSPACE:-$PWD}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src=$(pwd -W)
            profile="${USERPROFILE:-}"
            if [[ -n "$profile" ]]; then
              cargo_home=$(cygpath -w "${CARGO_HOME:-$profile/.cargo}")
              home=$(cygpath -w "$profile")
            fi
          else
            cargo_home="${CARGO_HOME:-${HOME:-}/.cargo}"
            home="${HOME:-}"
          fi
          if [[ -n "${cargo_home:-}" ]]; then
            flags+=("--remap-path-prefix=${cargo_home}=/cargo")
          fi
          if [[ -n "${src:-}" ]]; then
            flags+=("--remap-path-prefix=${src}=/src")
          fi
          if [[ -n "${home:-}" ]]; then
            flags+=("--remap-path-prefix=${home}=/home")
          fi
          if [[ ${#flags[@]} -gt 0 ]]; then
            export RUSTFLAGS="${RUSTFLAGS:-} ${flags[*]}"
          fi
          cargo build --locked --workspace --release

      # Release files for daily prereleases and stable releases:
      # the Windows browser binary, and self-extracting setup binaries packed
      # with `anvil-setup --pack`.
      - name: Pack release files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/daily' || github.ref == 'refs/heads/stable')
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="target/release/anvil.exe"
            setup="target/release/anvil-setup.exe"
            test -f "$bin"
            test -f "$setup"
            cp "$bin" dist/anvil.exe
            "$setup" --pack "$setup" "$bin" dist/AnvilBrowser-Setup-v.27-win64.exe
          else
            bin="target/release/anvil"
            setup="target/release/anvil-setup"
            test -f "$bin"
            test -f "$setup"
            "$setup" --pack "$setup" "$bin" dist/AnvilBrowser-Setup-v.27-linux64
            chmod +x dist/AnvilBrowser-Setup-v.27-linux64
          fi
          ls -l dist

      - name: Upload release files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/daily' || github.ref == 'refs/heads/stable')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/daily' && 'daily-prerelease' || 'stable-release' }}-${{ runner.os }}
          path: anvil-browser/dist/*
          if-no-files-found: error

  # The README promises Rust 1.99.1, so build and test on exactly that too.
  rust-1-99:
    name: Rust 1.99.1 on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: anvil-browser
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-browser

      - name: Check out adblock-rust
        working-directory: .
        run: |
          git init -q adblock-rust
          git -C adblock-rust fetch -q --depth 1 https://github.com/brave/adblock-rust.git "$ADBLOCK_RUST_REV"
          git -C adblock-rust checkout -q FETCH_HEAD

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libssl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          cache: false

      - name: Test in-tree Go engines
        working-directory: anvil-browser/engines/go
        run: |
          go vet ./...
          go test -v ./...
          for mod in anvil-compress anvil-hpack anvil-json anvil-pqc anvil-ttf anvil-image anvil-gpu anvil-video anvil-forge; do
            (cd "$mod" && go vet ./... && go test ./...)
          done

      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

  # ASan/UBSan for in-tree C++ units, plus a nightly Rust ASan smoke.
  sanitize:
    name: Sanitizers on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: anvil-browser
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-browser

      - name: Check out adblock-rust
        working-directory: .
        run: |
          git init -q adblock-rust
          git -C adblock-rust fetch -q --depth 1 https://github.com/brave/adblock-rust.git "$ADBLOCK_RUST_REV"
          git -C adblock-rust checkout -q FETCH_HEAD

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libssl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          cache: false

      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src
          rustup default nightly
          rustc --version

      - name: C++ ASan/UBSan compile
        run: ./scripts/sanitize.sh cpp

      - name: Rust ASan smoke
        run: ./scripts/sanitize.sh rust

  # Publish the daily release build after every required job has passed.
  # Weekly and stable do not run this job and their releases are left alone.
  daily-prerelease:
    name: Daily prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/daily'
    needs: [ci, rust-1-99, sanitize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packed files
        uses: actions/download-artifact@v4
        with:
          pattern: daily-prerelease-*
          merge-multiple: true
          path: dist

      - name: Publish v.27-daily
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/anvil.exe
          test -f dist/AnvilBrowser-Setup-v.27-linux64
          test -f dist/AnvilBrowser-Setup-v.27-win64.exe
          SHA="${{ github.sha }}"
          EXISTING_BODY="$(gh release view v.27-daily --json body --jq .body 2>/dev/null || true)"
          export EXISTING_BODY SHA
          python3 - << 'PY'
          import os, pathlib, re
          sha = os.environ["SHA"]
          line = f"Built from daily commit `{sha}`."
          existing = os.environ.get("EXISTING_BODY", "")
          if not existing.strip():
              text = (
                  "Anvil Browser **v.27** (`0.27.0`, `daily` prerelease).\n\n"
                  f"{line}\n"
              )
          else:
              text = re.sub(
                  r"^Built from daily commit `[0-9a-f]{40}`\.\n?",
                  "",
                  existing,
                  count=1,
                  flags=re.M,
              )
              if line not in text:
                  parts = text.split("\n", 1)
                  rest = parts[1] if len(parts) > 1 else ""
                  if rest.startswith("\n"):
                      text = parts[0] + "\n\n" + line + "\n" + rest
                  else:
                      text = parts[0] + "\n\n" + line + "\n\n" + rest
          text = text.replace(
              "(`0.26.1`, `daily` prerelease)",
              "(`0.27.0`, `daily` prerelease)",
              1,
          )
          pathlib.Path("release-notes.md").write_text(text)
          PY
          # Replace the rolling daily prerelease so the tag and assets match
          # this commit. This deletes only the v.27-daily tag, then creates it
          # again at this commit. It does not move weekly or stable.
          gh release delete v.27-daily --yes --cleanup-tag || true
          gh release create v.27-daily \
            --target "$SHA" \
            --prerelease \
            --title "Anvil Browser v.27 (Daily Prerelease)" \
            --notes-file release-notes.md \
            dist/anvil.exe \
            dist/AnvilBrowser-Setup-v.27-linux64 \
            dist/AnvilBrowser-Setup-v.27-win64.exe
          gh release view v.27-daily --json tagName,targetCommitish,isPrerelease,assets \
            --jq '{tag:.tagName,commit:.targetCommitish,prerelease:.isPrerelease,assets:[.assets[].name]}' \
            > release-check.json
          python3 - << PY
          import json, os, sys
          data = json.load(open("release-check.json"))
          sha = os.environ["SHA"]
          names = set(data["assets"])
          need = {
              "anvil.exe",
              "AnvilBrowser-Setup-v.27-linux64",
              "AnvilBrowser-Setup-v.27-win64.exe",
          }
          if data["commit"] != sha or not data["prerelease"] or not need <= names:
              print("daily prerelease does not match this commit", data, file=sys.stderr)
              sys.exit(1)
          print("daily prerelease ok", sha)
          PY
