# Build, test, lint, and release-build anvil-browser on Linux and Windows.
#
# Path dependencies point at sibling directories, so the job checks this
# repository out into its own folder and clones each sibling next to it:
# anvil-engine, the nine anvil-* libraries, and adblock-rust.
#
# adblock-rust is the one outside crate, and it brings its own crates.io
# dependencies. Every cargo command runs with --locked, so cargo only fetches
# exactly what Cargo.lock lists, and the check step below fails if any anvil
# crate itself depends on a crate from outside the anvil repositories.

name: ci

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # adblock-rust is pinned to the commit Cargo.lock was made from (0.13.3).
  ADBLOCK_RUST_REV: 6028a6d5735f1e81346eeef73c194c7240035248

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: anvil-browser
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-browser

      - name: Check out sibling repositories
        working-directory: .
        run: |
          for repo in anvil-engine anvil-cipher anvil-compress anvil-gpu anvil-hpack anvil-image anvil-json anvil-pqc anvil-ttf anvil-video; do
            git clone --depth 1 -b "${{ github.ref_name }}" "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo" 2>/dev/null || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo"
          done
          git init -q adblock-rust
          git -C adblock-rust fetch -q --depth 1 https://github.com/brave/adblock-rust.git "$ADBLOCK_RUST_REV"
          git -C adblock-rust checkout -q FETCH_HEAD

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libssl-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Check for outside crates
        run: |
          # Fails if Cargo.lock is out of date. Registry and git crates have a
          # source line in Cargo.lock; path crates don't. Only adblock-rust and
          # the crates it pulls in may have one, so no anvil crate may depend
          # on a crate that has a source line.
          cargo metadata --locked --format-version 1 > /dev/null
          awk '
            /^\[\[package\]\]/ { name = ""; outside = 0; n = 0; next }
            /^name = / { name = $3; gsub(/"/, "", name); next }
            /^source = / { outside = 1; next }
            /^ "/ { dep = $1; gsub(/[",]/, "", dep); deps[name, ++n] = dep; count[name] = n; next }
            /^$/ { if (name != "") { from_outside[name] = outside }; next }
            END {
              if (name != "") { from_outside[name] = outside }
              bad = 0
              for (pkg in from_outside) {
                if (pkg !~ /^anvil-/ || from_outside[pkg]) continue
                for (i = 1; i <= count[pkg]; i++) {
                  if (from_outside[deps[pkg, i]]) {
                    print pkg " depends on " deps[pkg, i] ", which is not an anvil crate."
                    bad = 1
                  }
                }
              }
              exit bad
            }
          ' Cargo.lock

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Release build
        run: cargo build --locked --workspace --release

  # The README promises Rust 1.99.1, so build and test on exactly that too.
  rust-1-99:
    name: Rust 1.99.1 on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: anvil-browser
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-browser

      - name: Check out sibling repositories
        working-directory: .
        run: |
          for repo in anvil-engine anvil-cipher anvil-compress anvil-gpu anvil-hpack anvil-image anvil-json anvil-pqc anvil-ttf anvil-video; do
            git clone --depth 1 -b "${{ github.ref_name }}" "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo" 2>/dev/null || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo"
          done
          git init -q adblock-rust
          git -C adblock-rust fetch -q --depth 1 https://github.com/brave/adblock-rust.git "$ADBLOCK_RUST_REV"
          git -C adblock-rust checkout -q FETCH_HEAD

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libssl-dev

      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace
